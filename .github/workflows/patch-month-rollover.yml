name: One-time month rollover indentation cleanup

on:
  push:
    branches:
      - repair/month-rollover-identity

permissions:
  contents: write

jobs:
  cleanup-rollover-indentation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: repair/month-rollover-identity

      - name: Fix guarded localStore indentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/localStore.ts')
          text = path.read_text()

          replacements = [
              (
                  "        const copiedFromId = String(payment.metadata?.copiedFromId || payment.id);\nconst exists = state.plannedPayments.some((candidate) =>\n  isRolloverPaymentDuplicate(payment, candidate, params.targetMonth)\n);\nif (exists) continue;\n",
                  "        const copiedFromId = String(payment.metadata?.copiedFromId || payment.id);\n        const exists = state.plannedPayments.some((candidate) =>\n          isRolloverPaymentDuplicate(payment, candidate, params.targetMonth)\n        );\n        if (exists) continue;\n",
                  'payment',
              ),
              (
                  "        const copiedFromId = String(income.metadata?.copiedFromId || income.id);\nconst exists = incomes.some((candidate) =>\n  isRolloverIncomeDuplicate(income, candidate, params.targetMonth)\n);\nif (exists) continue;\n",
                  "        const copiedFromId = String(income.metadata?.copiedFromId || income.id);\n        const exists = incomes.some((candidate) =>\n          isRolloverIncomeDuplicate(income, candidate, params.targetMonth)\n        );\n        if (exists) continue;\n",
                  'income',
              ),
          ]

          for old, new, label in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected unindented {label} rollover block exactly once.')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          git diff --check
          git diff -- src/localStore.ts

      - name: Commit indentation cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/localStore.ts
          git commit -m 'Tidy canonical rollover blocks'
          git push origin HEAD:repair/month-rollover-identity
