name: One-time MVSelect modal Tab scope patch

on:
  push:
    branches:
      - repair/mvselect-modal-tab-scope

permissions:
  contents: write

jobs:
  patch-mvselect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: repair/mvselect-modal-tab-scope

      - name: Apply guarded MVSelect accessibility repair
        shell: bash
        run: |
          python .github/scripts/patch_mvselect_modal_tab.py
          rm .github/scripts/patch_mvselect_modal_tab.py
          rm .github/workflows/patch-mvselect-modal-tab.yml
          git diff --check

      - name: Commit guarded repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/MVSelect.tsx src/globalMvDropdownSystemAudit.test.ts docs/GLOBAL-AUDIT-LEDGER.md .github/scripts/patch_mvselect_modal_tab.py .github/workflows/patch-mvselect-modal-tab.yml
          git commit -m "Keep MVSelect Tab traversal inside active modals"
          git push origin HEAD:repair/mvselect-modal-tab-scope
