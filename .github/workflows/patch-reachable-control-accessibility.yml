name: One-time reachable control accessibility patch

on:
  push:
    branches:
      - repair/reachable-control-accessibility

permissions:
  contents: write

jobs:
  patch-accessibility:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: repair/reachable-control-accessibility

      - name: Apply guarded accessibility repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected source block exactly once, found {text.count(old)}')
              file.write_text(text.replace(old, new, 1))

          nav_path = Path('src/components/Navigation.tsx')
          nav = nav_path.read_text()
          panel_start = nav.find('        {isMoreOpen && (\n          <div\n            ref={morePanelRef}')
          grid_start = nav.find('        <div className="mv-mobile-nav-grid grid grid-cols-5 h-14">', panel_start)
          mobile_nav_start = nav.find('<nav className="mv-nav-mobile', 0)
          if panel_start < 0 or grid_start < 0 or mobile_nav_start < 0 or panel_start > grid_start:
              raise SystemExit('Navigation: expected mobile More panel before nav grid.')
          panel = nav[panel_start:grid_start]
          nav = nav[:panel_start] + nav[grid_start:]
          mobile_nav_end = nav.find('      </nav>', mobile_nav_start)
          if mobile_nav_end < 0:
              raise SystemExit('Navigation: mobile nav closing tag not found.')
          nav = nav[:mobile_nav_end] + panel + nav[mobile_nav_end:]
          nav_path.write_text(nav)

          replace_once(
              'src/components/TransactionList.tsx',
              '                  tabIndex={canEditRow ? 0 : undefined}\n',
              '',
              'TransactionList tab stop',
          )
          replace_once(
              'src/components/TransactionList.tsx',
              """                  onKeyDown={(event) => {
                    if (!canEditRow || event.target !== event.currentTarget) return;
                    if (event.key === 'Enter' || event.key === ' ') {
                      event.preventDefault();
                      onEditTransaction(tx);
                    }
                  }}
""",
              '',
              'TransactionList pseudo-button keyboard handler',
          )
          replace_once(
              'src/components/IncomeView.tsx',
              '                        tabIndex={canEdit ? 0 : undefined}\n',
              '',
              'Income row tab stop',
          )
          replace_once(
              'src/components/IncomeView.tsx',
              """                        onKeyDown={(event) => {
                          if (!canEdit || event.target !== event.currentTarget) return;
                          if (event.key === 'Enter' || event.key === ' ') {
                            event.preventDefault();
                            openEdit(income);
                          }
                        }}
""",
              '',
              'Income pseudo-button keyboard handler',
          )

          for path, expected in [
              ('src/components/IncomeView.tsx', 1),
              ('src/components/SavingsView.tsx', 2),
              ('src/components/AccountsView.tsx', 2),
          ]:
              file = Path(path)
              text = file.read_text()
              count = text.count('autoFocus')
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} autoFocus occurrence(s), found {count}')
              text = text.replace('                  autoFocus\n', '')
              text = text.replace('                        autoFocus\n', '')
              if 'autoFocus' in text:
                  raise SystemExit(f'{path}: autoFocus remained after guarded removal')
              file.write_text(text)

          replace_once(
              'src/components/SavingsView.tsx',
              """              <button
                type="button"
                onClick={() => setShowGoalModal(false)}
                className="mv-modal-close"
              >
""",
              """              <button
                type="button"
                onClick={() => setShowGoalModal(false)}
                className="mv-modal-close"
                aria-label="Close add savings goal"
              >
""",
              'Savings add-goal close name',
          )
          replace_once(
              'src/components/AccountsView.tsx',
              """              <button
                type="button"
                onClick={() => {
                  setShowEditGoalModal(false);
                  setSelectedGoal(null);
                }}
                className="mv-modal-close"
              >
""",
              """              <button
                type="button"
                onClick={() => {
                  setShowEditGoalModal(false);
                  setSelectedGoal(null);
                }}
                className="mv-modal-close"
                aria-label="Close edit savings goal"
              >
""",
              'Accounts edit-goal close name',
          )
          replace_once(
              'src/components/TransactionModal.tsx',
              '                                title="Remove split"\n',
              '                                title="Remove split"\n                                aria-label={`Remove split ${idx + 1}`}\n',
              'Transaction split remove name',
          )

          ledger_path = Path('docs/GLOBAL-AUDIT-LEDGER.md')
          ledger = ledger_path.read_text()
          marker = '**Mandatory freshness rule:** the baseline above is historical as soon as `main` advances. At the start of every audit session, verify `main`, current workflows, deployment and open/draft PRs again.\n'
          if ledger.count(marker) != 1:
              raise SystemExit('Audit ledger freshness marker not found exactly once.')
          addendum = (
              '\n### 2026-09-11 current-main reconciliation\n\n'
              '- Verified deployed `main` before this accessibility stage: `624787be8a5541e804040e04c848eaade4988a12` (PR #193).\n'
              '- Main workflow run #857: test/build/privacy/local-only checks `PASS`; GitHub Pages deployment `PASS`.\n'
              '- PRs #188–#193 are merged and deployed. They respectively repaired field accessible names, Settings tab semantics, primary navigation history semantics, native browser feedback, modal-stack accessibility, and Prepare Next Month identity.\n'
              '- `GA-INC-001` optional-category wording defect is technically resolved by PR #188; physical current-main regression remains governed by the device matrix.\n'
              '- `GA-MONTH-001` broad rollover duplicate identity is technically resolved by PR #193 with shared UI/storage identity and lineage idempotency; physical current-main regression remains governed by the device matrix.\n'
              '- `GA-A11Y-001` remains `OPEN` during `repair/reachable-control-accessibility`. Current source inventory found mobile More disclosure forward-tab order, focusable non-semantic Activity/Income articles, forced text-field autofocus in Income/Savings/Accounts dialogs, and unnamed icon-only Savings Goal close controls. This branch repairs only those proven interaction/name/focus defects and adds source-level regression coverage; physical verification is not claimed.\n'
              '- `GA-TP-002` per-bill Undo Funding attribution remains `BLOCKED`; this accessibility stage does not change Transfer Plan attribution or financial semantics.\n'
          )
          ledger_path.write_text(ledger.replace(marker, marker + addendum, 1))
          PY

          git rm .github/workflows/patch-reachable-control-accessibility.yml
          git diff --check
          git diff --stat

      - name: Commit repaired accessibility stage
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair reachable control accessibility'
          git push origin HEAD:repair/reachable-control-accessibility
