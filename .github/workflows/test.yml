name: Test, Build & Startup Smoke Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Run automated test suite
        run: npm test

      - name: Use Java 21 for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run Firestore emulator store tests
        env:
          GOOGLE_CLOUD_PROJECT: regal-campus-198sv
          MV_FIRESTORE_DATABASE_ID: "(default)"
        run: >-
          npx --yes firebase-tools@15.28.2 emulators:exec
          --project regal-campus-198sv
          --only firestore
          "npx vitest run server/storage/firestoreStore.emulator.test.ts && npx vitest run server/storage/readParity.emulator.test.ts && npx vitest run server/storage/coreMutationParity.emulator.test.ts && npx vitest run server/storage/edgeMutationParity.emulator.test.ts"

      - name: Verify browser Firestore boundary
        shell: bash
        run: |
          set -euo pipefail

          if grep -R --line-number --fixed-strings "firebase/firestore" src; then
            echo "Browser code must not access Firestore directly"
            exit 1
          fi

          grep --fixed-strings "allow read, write: if false;" firestore.rules
          grep --fixed-strings '"database": "ai-studio-mv-02fb52df-6e5f-458e-bc1e-b1fdc07a8db7"' firebase.json

      - name: Build production bundle
        run: npm run build

      - name: Refuse Cloud Run ephemeral SQLite
        shell: bash
        run: |
          set -euo pipefail
          set +e
          K_SERVICE=mv-ci K_REVISION=mv-ci-00001 NODE_ENV=production npm start > /tmp/mv-storage-safety.log 2>&1
          exit_code=$?
          set -e

          cat /tmp/mv-storage-safety.log

          if [ "$exit_code" -eq 0 ]; then
            echo "Expected Cloud Run + SQLite startup to be refused, but npm start succeeded"
            exit 1
          fi

          grep --fixed-strings "Refusing Cloud Run startup with SQLite" /tmp/mv-storage-safety.log

      - name: Production startup smoke test
        shell: bash
        run: |
          set -euo pipefail
          PORT=3000 npm start > /tmp/mv-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/system/schema-status > /tmp/mv-health.json; then
              cat /tmp/mv-health.json
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "MV production server exited before becoming ready"
              cat /tmp/mv-server.log
              exit 1
            fi
            sleep 1
          done

          echo "MV production server did not become ready within 20 seconds"
          cat /tmp/mv-server.log
          exit 1
