name: Deploy MV to Cloud Run

on:
  push:
    branches:
      - deploy-production
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (default: current main)"
        required: false
        default: "main"

permissions:
  contents: read
  id-token: write

concurrency:
  group: mv-production-deploy
  cancel-in-progress: false

env:
  PROJECT_ID: regal-campus-198sv
  REGION: us-east1
  SERVICE: mv
  RUNTIME_SERVICE_ACCOUNT: mv-runtime@regal-campus-198sv.iam.gserviceaccount.com

jobs:
  deploy:
    name: Deploy verified Firestore revision
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require deployment identity configuration
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "$WIF_PROVIDER" ]; then
            echo "::error::Missing production variable GCP_WORKLOAD_IDENTITY_PROVIDER"
            exit 1
          fi
          if [ -z "$DEPLOY_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing production variable GCP_DEPLOY_SERVICE_ACCOUNT"
            exit 1
          fi

      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.ref || 'main' }}
          fetch-depth: 0

      - name: Resolve deployment source
        id: source
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Refuse unverified manual main mismatch
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.ref || 'main') == 'main' }}
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Refuse deploy-production drift from main
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify default Firestore exists
        run: |
          set -euo pipefail
          gcloud firestore databases describe \
            --project="$PROJECT_ID" \
            --database="(default)" \
            --format="value(name,type,locationId)"

      - name: Verify runtime service account exists
        run: |
          set -euo pipefail
          gcloud iam service-accounts describe "$RUNTIME_SERVICE_ACCOUNT" \
            --project="$PROJECT_ID" \
            --format="value(email)"

      - name: Deploy deny-all Firestore browser rules
        run: |
          set -euo pipefail
          npx --yes firebase-tools@15.28.2 deploy \
            --project "$PROJECT_ID" \
            --only firestore:rules \
            --non-interactive

      - name: Deploy new Cloud Run revision with no traffic
        id: deploy
        run: |
          set -euo pipefail

          gcloud run deploy "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --source=. \
            --no-traffic \
            --service-account="$RUNTIME_SERVICE_ACCOUNT" \
            --update-env-vars='NODE_ENV=production,MV_DATA_BACKEND=firestore,MV_FIRESTORE_DATABASE_ID=(default)' \
            --quiet

          revision="$(gcloud run services describe "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format='value(status.latestCreatedRevisionName)')"

          if [ -z "$revision" ]; then
            echo "::error::Cloud Run did not report a latest created revision"
            exit 1
          fi

          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Verify new revision is Ready before traffic
        env:
          REVISION: ${{ steps.deploy.outputs.revision }}
        run: |
          set -euo pipefail

          gcloud run revisions describe "$REVISION" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format=json > /tmp/revision.json

          cat /tmp/revision.json

          jq -e 'any(.status.conditions[]?; .type == "Ready" and .status == "True")' \
            /tmp/revision.json >/dev/null

          test "$(jq -r '.spec.serviceAccountName' /tmp/revision.json)" = "$RUNTIME_SERVICE_ACCOUNT"

      - name: Shift production traffic only after readiness
        id: live
        env:
          REVISION: ${{ steps.deploy.outputs.revision }}
        run: |
          set -euo pipefail

          gcloud run services update-traffic "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --to-latest \
            --quiet

          ready_revision="$(gcloud run services describe "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format='value(status.latestReadyRevisionName)')"

          if [ "$ready_revision" != "$REVISION" ]; then
            echo "::error::Latest Ready revision '$ready_revision' does not equal deployed revision '$REVISION'"
            exit 1
          fi

          service_url="$(gcloud run services describe "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format='value(status.url)')"

          if [ -z "$service_url" ]; then
            echo "::error::Cloud Run service has no URL"
            exit 1
          fi

          echo "url=$service_url" >> "$GITHUB_OUTPUT"

      - name: Verify live Firestore backend
        env:
          SERVICE_URL: ${{ steps.live.outputs.url }}
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            "$SERVICE_URL/api/system/schema-status" \
            -o /tmp/schema-status.json

          cat /tmp/schema-status.json
          grep --fixed-strings '"backend":"firestore"' /tmp/schema-status.json

          curl --fail --silent --show-error \
            "$SERVICE_URL/" \
            -o /tmp/mv-index.html

          grep --ignore-case --fixed-strings '<!doctype html>' /tmp/mv-index.html

      - name: Deployment summary
        env:
          SERVICE_URL: ${{ steps.live.outputs.url }}
          REVISION: ${{ steps.deploy.outputs.revision }}
        run: |
          {
            echo "## MV production deployment"
            echo
            echo "- Ref: \`${{ github.event_name == 'push' && 'deploy-production' || inputs.ref || 'main' }}\`"
            echo "- Commit: \`${{ steps.source.outputs.sha }}\`"
            echo "- Project: \`$PROJECT_ID\`"
            echo "- Region: \`$REGION\`"
            echo "- Service: \`$SERVICE\`"
            echo "- Revision: \`$REVISION\`"
            echo "- Runtime identity: \`$RUNTIME_SERVICE_ACCOUNT\`"
            echo "- URL: $SERVICE_URL"
            echo "- Backend verification: Firestore"
            echo "- Traffic shift: after revision Ready"
          } >> "$GITHUB_STEP_SUMMARY"
