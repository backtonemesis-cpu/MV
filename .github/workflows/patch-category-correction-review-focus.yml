name: One-time Category Correction review focus patch

on:
  push:
    branches:
      - repair/category-correction-review-focus

permissions:
  contents: write

jobs:
  patch-category-correction-focus:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: repair/category-correction-review-focus

      - name: Apply guarded accessibility repair
        run: |
          python .github/tmp/patch-category-correction-review-focus.py
          rm .github/tmp/patch-category-correction-review-focus.py
          rm .github/workflows/patch-category-correction-review-focus.yml
          git diff --check

      - name: Commit guarded repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/CategoryCorrection.tsx src/categoryCorrectionReviewFocusAudit.test.ts docs/GLOBAL-AUDIT-LEDGER.md .github/tmp/patch-category-correction-review-focus.py .github/workflows/patch-category-correction-review-focus.yml
          git commit -m "Move Category Correction focus to review before confirm"
          git push origin HEAD:repair/category-correction-review-focus
