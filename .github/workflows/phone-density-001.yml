name: PHONE-DENSITY-001 guarded repair

on:
  push:
    branches:
      - repair/phone-summary-density

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: repair/phone-summary-density
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded density repair
        run: python3 .github/scripts/apply_phone_density_001.py
      - name: Verify patch formatting
        run: git diff --check
      - name: Install dependencies without lockfile
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Run focused density regression
        run: npx vitest run src/phoneSummaryDensityAudit.test.ts
      - name: Commit cleaned repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair Phone summary metric density"
          git push origin HEAD:repair/phone-summary-density
