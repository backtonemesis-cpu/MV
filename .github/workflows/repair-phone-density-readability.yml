name: Repair Phone density readability

on:
  push:
    branches:
      - repair/phone-summary-density-readability

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v5
        with:
          ref: repair/phone-summary-density-readability
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply guarded repair
        run: python .github/scripts/repair_phone_density_readability.py

      - name: Verify patch formatting
        run: git diff --check

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run focused density regression
        run: npx vitest run src/phoneSummaryDensityAudit.test.ts

      - name: Clean generated and temporary files
        run: |
          rm -f package-lock.json
          git rm .github/scripts/repair_phone_density_readability.py
          git rm .github/workflows/repair-phone-density-readability.yml

      - name: Commit cleaned repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mobileUx.css src/phoneSummaryDensityAudit.test.ts docs/GLOBAL-AUDIT-LEDGER.md
          git diff --cached --check
          git status --short
          git commit -m "Repair Phone summary density readability"
          git push origin HEAD:repair/phone-summary-density-readability
